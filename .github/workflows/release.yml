name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${{ inputs.tag || github.ref_name }}"

          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match package.json version v${VERSION}." >&2
            exit 1
          fi

          # A SemVer pre-release tag (0.6.0-beta.1) marks a build that is not
          # for the general channel: it produces a downloadable artifact and a
          # pre-release GitHub release, and is never pushed to a marketplace,
          # where it would become the version every user upgrades into.
          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Run checks
        run: npm test

      - name: Extract changelog entry
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          awk -v version="${VERSION}" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no entry for ${VERSION}." >&2
            exit 1
          fi

      - name: Package extension
        run: npm run package -- --no-dependencies

      - name: Publish to Open VSX
        if: steps.metadata.outputs.prerelease == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.metadata.outputs.vsix }}
        run: npx --yes ovsx publish "${VSIX}" -p "${OVSX_PAT}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.metadata.outputs.vsix }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
