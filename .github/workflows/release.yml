name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          TAG="${GITHUB_REF_NAME}"

          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match package.json version v${VERSION}." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "${GITHUB_OUTPUT}"

      - name: Run checks
        run: npm test

      - name: Package extension
        run: npm run package -- --no-dependencies

      - name: Publish to VS Code Marketplace
        env:
          VSIX: ${{ steps.metadata.outputs.vsix }}
        run: npx vsce publish --oidc --packagePath "${VSIX}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.metadata.outputs.vsix }}
          generate_release_notes: true
          fail_on_unmatched_files: true